<!DOCTYPE html>
<html>
<head>
    <title>Order Successful</title>
</head>

<body>

    <h1>✅ Order Placed Successfully!</h1>

    <h2>Your Cart Order</h2>

    {% for order in orders %}

        <p>
            {{ order.food.name }}
            × {{ order.quantity }}
            = ₹{{ order.total_price }}
        </p>

    {% endfor %}

    <h2>Total: ₹{{ total }}</h2>

    <p>Status: Pending</p>

    <a href="/">Back to Menu</a>

</body>
</html>
