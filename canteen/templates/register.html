<!DOCTYPE html>
<html>
<head>
    <title>Smart Canteen - Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff4e6, #ffe0b2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        .icon {
            font-size: 50px;
        }

        h1 {
            color: #333;
            margin: 10px 0;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #ff9800;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #ff9800;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #f57c00;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        .login-link {
            display: inline-block;
            margin-top: 20px;
            color: #ff9800;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <div class="icon">👤</div>

        <h1>Create Account</h1>

        <p class="subtitle">Join Smart Canteen</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Enter username" required>

            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Enter password" required>

            <button type="submit" class="register-btn">
                Create Account ✨
            </button>
        </form>

        <a href="{% url 'login' %}" class="login-link">
            Already have an account? Login
        </a>

    </div>

</body>
</html>
