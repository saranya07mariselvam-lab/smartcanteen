<!DOCTYPE html>
<html>
<head>
    <title>Smart Canteen</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        .header {
            background-color: #6c5ce7;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .food-card {
            background-color: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 3px 10px #cccccc;
        }

        .food-card h2 {
            margin-top: 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        .order-btn {
            background-color: #6c5ce7;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .order-btn:hover {
            background-color: #5849c4;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🍱 Smart Canteen</h1>
        <p>Fresh Food • Easy Ordering</p>
    </div>

    <div class="container">

        <h2>🍔 Food Menu</h2>

        {% for food in foods %}

        <div class="food-card">

            <h2>{{ food.name }}</h2>

            <p>{{ food.description }}</p>

            <p class="price">₹{{ food.price }}</p>

            <p>Category: {{ food.category }}</p>

            <p>Available Stock: {{ food.stock }}</p>

            <button class="order-btn">
                Order Now
            </button>

        </div>

        {% empty %}

        <p>No food available.</p>

        {% endfor %}

    </div>

</body>
</html>
